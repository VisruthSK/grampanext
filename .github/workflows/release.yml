name: Release extension ZIPs

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Package Chrome and Firefox builds
        run: |
          for target in chrome firefox; do
            mkdir -p "dist/$target"
            cp -R src styles LICENSE NOTICE "dist/$target"


            cp "manifest.$target.json" "dist/$target/manifest.json"
            (cd "dist/$target" && zip -qr "../grampanext-$target.zip" .)
          done
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
