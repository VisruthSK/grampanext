<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grampanext settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <h1>Grampanext</h1>
    </header>

    <section aria-labelledby="highlight-label">
      <div class="section-heading">
        <h2 id="highlight-label">Highlight</h2>
        <button id="reset-colour" type="button" class="text-button">Reset</button>
      </div>

      <div class="picker" id="colour-picker">
        <canvas
          id="colour-field"
          width="216"
          height="132"
          aria-label="Choose saturation and brightness"
          role="slider"
          tabindex="0"
          aria-valuemin="0"
          aria-valuemax="100"
        ></canvas>
        <span id="colour-cursor" class="picker-cursor" aria-hidden="true"></span>
      </div>

      <label class="hue-control" for="hue">
        <span>Hue</span>
        <input id="hue" type="range" min="0" max="360" value="43">
      </label>

      <div class="colour-meta">
        <span id="colour-preview" class="colour-preview" aria-hidden="true"></span>
        <label for="colour-value">Hex</label>
        <input id="colour-value" type="text" value="#fcd34d" inputmode="text" autocomplete="off" spellcheck="false">
      </div>
    </section>

    <section class="shortcut" aria-labelledby="shortcut-label">
      <div>
        <h2 id="shortcut-label">Shortcut</h2>
        <output id="current-shortcut">Loading…</output>
      </div>
      <button id="change-shortcut" type="button" class="text-button">Change</button>
    </section>

    <p id="status" role="status" aria-live="polite"></p>
  </main>

  <script src="popup.js"></script>
</body>
</html>
